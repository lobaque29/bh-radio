services:
  - type: web
    name: bh-radio-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://lobaque29.github.io